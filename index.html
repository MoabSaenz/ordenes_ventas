<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Ordenes de ventas</title>
</head>
<body>
    <header>
        <h1>NUEVA ORDEN DE VENTAS</h1>
    </header>
    <main>
        {% if mensaje %}
            <p style="color: green;">{{ mensaje }}</p>
        {% endif %}
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form id="formulario" method="post" action="/">
            {% csrf_token %}
            <label for="usuario">usuario que registra</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="orden">numero de orden:</label>
            <input type="text" id="orden" name="orden" required>

            <label for="fecha">fecha:</label>
            <input type="date" id="fecha" name="fecha">

            <label for="descripcion">descripcion:</label>
            <input type="text" id="descripcion" name="descripcion">

            <label for="estatus">estatus:</label>
            <select id="estatus" name="estatus">
                <option value="pendiente">Pendiente</option>
                <option value="proceso">En proceso</option>
                <option value="completo">Completo</option>
            </select>

            <label for="fecha_termino">fecha termino:</label>
            <input type="date" id="fecha_termino" name="fecha_termino">

            <label for="factura">factura:</label>
            <input type="number" id="factura" name="factura">

            <label for="comentarios">Comentarios:</label>
            <input type="text" id="comentarios" name="comentarios">

            <button type="submit">Guardar</button>
            <button type="button" id="deshacer">Deshacer</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
