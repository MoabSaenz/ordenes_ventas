<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Órdenes{% endblock %}</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="bg-light">

    <div class="mobile-topbar d-md-none">
        <button class="hamburger" id="sidebarToggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="mainSidebar">
            <span></span><span></span><span></span>
        </button>
        <span class="mobile-topbar-title">Sistema de Órdenes</span>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="d-flex min-vh-100">
        <aside class="sidebar bg-white border-end shadow-sm" id="mainSidebar">
            <div class="sidebar-header p-4 border-bottom">
                <h2 class="h5 mb-0">Sistema</h2>
                <p class="text-muted small mb-0">Control de órdenes</p>
            </div>
            <nav class="nav flex-column p-3 gap-2">
                <a class="btn btn-outline-primary text-start w-100" href="{% url 'dashboard' %}">Inicio</a>
                <a class="btn btn-outline-primary text-start w-100" href="{% url 'home' %}">Captura de datos</a>
                {% if user.is_superuser or perms.auth.change_user %}
                    <a class="btn btn-outline-primary text-start w-100" href="{% url 'gestion_usuarios' %}">Usuarios</a>
                    <a class="btn btn-outline-primary text-start w-100" href="{% url 'actividad' %}">Actividad</a>
                {% endif %}
                <a class="btn btn-outline-primary text-start w-100" href="{% url 'reportes' %}">Reportes</a>
            </nav>
            <div class="sidebar-footer p-4 border-top mt-auto">
                <div class="mb-2 text-muted small">Conectado como</div>
                <div class="fw-semibold mb-3">{{ user.username }}</div>
                <a class="btn btn-link text-danger p-0" href="{% url 'logout' %}">Cerrar sesión</a>
            </div>
        </aside>

        <main class="flex-grow-1 p-4 main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        (function () {
            var sidebar = document.getElementById('mainSidebar');
            var toggle = document.getElementById('sidebarToggle');
            var backdrop = document.getElementById('sidebarBackdrop');

            function closeSidebar() {
                sidebar.classList.remove('is-open');
                backdrop.classList.remove('is-open');
                toggle.classList.remove('is-active');
                toggle.setAttribute('aria-expanded', 'false');
                document.body.classList.remove('sidebar-locked');
            }

            function openSidebar() {
                sidebar.classList.add('is-open');
                backdrop.classList.add('is-open');
                toggle.classList.add('is-active');
                toggle.setAttribute('aria-expanded', 'true');
                document.body.classList.add('sidebar-locked');
            }

            toggle.addEventListener('click', function () {
                sidebar.classList.contains('is-open') ? closeSidebar() : openSidebar();
            });

            backdrop.addEventListener('click', closeSidebar);

            sidebar.querySelectorAll('a, button').forEach(function (el) {
                el.addEventListener('click', closeSidebar);
            });

            window.addEventListener('resize', function () {
                if (window.innerWidth >= 768) closeSidebar();
            });
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'script.js' %}"></script>
</body>
</html>
