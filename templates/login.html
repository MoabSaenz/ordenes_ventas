<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

<h1>Iniciar sesión</h1>

{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <label>Usuario</label>
    <input type="text" name="username" required>

    <br><br>

    <label>Contraseña</label>
    <input type="password" name="password" required>

    <br><br>

    <button type="submit">Entrar</button>

</form>

</body>
</html>
