<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Sistema de Órdenes</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>

<body>
    <div class="login-container">

        <div class="login-header">
            <div class="login-logo">
                <div class="login-logo-inner">
                    <!-- Emblema por defecto: silueta de tuerca (hexágono + orificio).
                         Para usar tu propio logo, reemplaza este <svg> por:
                         <img src="{% static 'img/logo.png' %}" alt="Logo"> -->
                    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 3 L42 13.5 L42 34.5 L24 45 L6 34.5 L6 13.5 Z" stroke-linejoin="round"/>
                        <circle cx="24" cy="24" r="10"/>
                    </svg>
                </div>
            </div>
            <div class="login-header-text">
                <h1>Sistema de Órdenes</h1>
                <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
            </div>
        </div>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" class="login-form">
            {% csrf_token %}

            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" required autofocus>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <p class="login-footnote">Acceso restringido al personal autorizado</p>
    </div>
</body>
</html>
